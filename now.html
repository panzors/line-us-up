<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PARTY MODE</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body class="go-page">
  <header class="bar">
    <a id="back" href="index.html" aria-label="Back to lineup" title="Lineup">📅</a>
    <span id="title" class="muted">PARTY MODE</span>
    <span id="clock"></span>
  </header>
  <nav id="days" class="seg" aria-label="Your days" hidden></nav>
  <main id="lineup" aria-live="polite"><p class="muted">Loading…</p></main>
  <!-- The chosen day's picks on a time scale, below the Now/Next cards. -->
  <section id="full" hidden>
    <h2 id="full-title">Timeline</h2>
    <div id="timeline"></div>
  </section>
  <script type="module" src="now.js"></script>
</body>
</html>
